name: TSPP

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tspp-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  feature-capsules:
    name: Feature capsules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      # The end-to-end plugin tests compile through the workspace compiler, which imports the plugin SDK.
      - run: pnpm build:plugin-sdk && pnpm build:plugins && pnpm build:compiler
      - run: pnpm test:plugins:run
      - run: pnpm test:core-parity

  plugins-together:
    name: Plugins together and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm build:plugin-sdk && pnpm build:plugins && pnpm build:compiler
      - run: pnpm test:plugins:together
      - run: pnpm test:examples

  products:
    name: Build and test products
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          TSPP_PLAYGROUND_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'master' }}
      - name: Type check the Playground
        run: pnpm --filter tspp-playground typecheck
      - name: Test Playground site assembly
        run: pnpm --filter tspp-playground test:site
      # The build above supplies the real tsserver and every plugin that editor conformance exercises.
      - run: pnpm test:editor-conformance:run
      - run: pnpm test:language-server
      - run: pnpm test:vscode
      - name: Run every Playground source file in a browser
        run: pnpm test:playground
      # The unit tests of what TS++ added to the compiler. The full upstream suite does not run here.
      - run: pnpm test:compiler:tspp
      - name: Archive the tested branch preview
        if: github.event_name == 'push'
        working-directory: packages/playground/dist
        run: zip -q -r "$RUNNER_TEMP/playground-preview.zip" .
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: playground-preview
          path: ${{ runner.temp }}/playground-preview.zip
          if-no-files-found: error
          overwrite: true

  core-drift:
    name: Core drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The reports diff against the tspp-core-baseline and tspp-lsp-baseline tags.
          fetch-depth: 0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      # Fails on upstream changes without a TSPP-SLOT marker and on changed lines over the budget
      # (docs/plugin-framework.md, "Core modification rules").
      - run: node scripts/core-diff.mjs --check
      # The same rules for the language server against tspp-lsp-baseline ("Language server modification rules").
      - run: node scripts/core-diff.mjs --target lsp --check
      # A version below one already released would never be released, so it fails here, before it reaches master.
      - name: Check the release version
        run: node scripts/release-version.mjs

  quality:
    name: Lint and unused exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm --filter ts-plus-plus exec hereby generate-diagnostics
      - run: pnpm build:plugin-sdk && pnpm build:plugins
      - run: pnpm lint:packages
      - run: pnpm lint:compiler
      - run: pnpm lint:language-server
      - run: pnpm test:eslint-rules
      - run: pnpm knip

  windows-launcher:
    name: Windows launcher smoke test
    runs-on: windows-latest
    steps:
      - name: Enable long paths for Git
        run: git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm build:vscode:dev
