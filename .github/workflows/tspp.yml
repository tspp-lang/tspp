name: TS++

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tspp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  feature-capsules:
    name: Feature capsules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      # The end-to-end plugin tests compile through the workspace compiler, which imports the plugin SDK.
      - run: pnpm build:plugin-sdk && pnpm build:plugins && pnpm build:compiler
      - run: pnpm test:features
      - run: pnpm test:examples

  core-drift:
    name: Core drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The report diffs against the tspp-core-baseline tag.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      # Fails on upstream changes without a TSPP-SLOT marker and on changed lines over the budget
      # (docs/plugin-framework.md, "Core modification rules").
      - run: node scripts/core-diff.mjs --check

  products:
    name: Build products
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:language-server
      - run: pnpm test:vscode

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:plugin-sdk
      - run: pnpm build:plugins
      - run: pnpm lint:packages

  windows-launcher:
    name: Windows launcher smoke test
    runs-on: windows-latest
    steps:
      - name: Enable long paths for Git
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vscode:dev
