name: TS++

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tspp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  feature-capsules:
    name: Feature capsules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      # The end-to-end plugin tests compile through the workspace compiler, which imports the plugin SDK.
      - run: pnpm build:plugin-sdk && pnpm build:plugins && pnpm build:compiler
      - run: pnpm test:features
      - run: pnpm test:examples

  core-drift:
    name: Core drift report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The report diffs against the tspp-core-baseline tag.
          fetch-depth: 0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      # Reported only for now; docs/core-restoration-plan.md phase 3 turns it into a gate.
      - run: node scripts/core-diff.mjs

  products:
    name: Build products
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:language-server
      - run: pnpm test:vscode

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:plugin-sdk
      - run: pnpm build:plugins
      - run: pnpm lint:packages

  windows-launcher:
    name: Windows launcher smoke test
    runs-on: windows-latest
    steps:
      - name: Enable long paths for Git
        run: git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vscode:dev
