name: Deploy playground to GitHub Pages

# Publish tested branch previews and release zips together from the default branch.

on:
  workflow_run:
    workflows: [TSPP, Release]
    types: [completed]
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      preview:
        description: Branch preview to update, or refresh the release list
        type: choice
        options: [master, dev, releases]
        default: master

permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max

jobs:
  publish:
    name: Publish playground site
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        (github.event.workflow_run.name == 'Release' ||
         github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
        id: pages
      - name: Restore the published previews and select the tested update
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node packages/playground/scripts/prepare-previews.mjs previews
      - name: Download the playground of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and any(.assets[]; .name | test("^tspp-playground-.*[.]zip$"))) | .tag_name')
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              gh release download --repo "$GITHUB_REPOSITORY" --pattern 'tspp-playground-*.zip' --dir releases -- "$tag"
            fi
          done <<< "$tags"
      - name: Assemble the site
        run: node packages/playground/scripts/assemble-site.mjs --previews previews --deployment "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --releases releases --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
