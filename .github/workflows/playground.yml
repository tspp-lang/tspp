name: Deploy playground to GitHub Pages

# The site serves the latest release at its root, master at next/ and every release at v/<version>/, each release from
# the playground zip its GitHub release carries (packages/playground/scripts/assemble-site.mjs). It is assembled anew
# on every push to master and after every release, so a new release appears as soon as it is published.

on:
  push:
    branches: [master]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate compiler diagnostics
        run: pnpm --filter ts-plus-plus exec hereby generate-diagnostics
      - name: Build plugin runtime
        run: |
          pnpm build:plugin-sdk
          pnpm build:plugins
      - name: Build playground
        run: pnpm build:playground
      # A failure here keeps the last working playground deployed.
      - name: Run every Playground source file in a browser
        run: pnpm test:playground
      - name: Download the playground of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            # Releases from before the playground was released carry none.
            gh release download "$tag" --pattern 'tspp-playground-*.zip' --dir releases || echo "$tag has no playground."
          done
      - name: Assemble the site
        run: node packages/playground/scripts/assemble-site.mjs --next packages/playground/dist --releases releases --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
