name: Feature request
description: Propose a TS++ language, compiler, or tooling capability
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should TS++ address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Show the smallest syntax or API example that explains the idea.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Isolation and compatibility boundary
      description: Explain how this can remain isolated and how it interacts with TypeScript behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
