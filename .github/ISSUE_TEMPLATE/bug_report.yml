name: Bug report
description: Report a reproducible TS++ problem
body:
  - type: markdown
    attributes:
      value: |
        Search existing TS++ issues before filing a new one. If the behavior is
        unchanged from upstream TypeScript, include that comparison explicitly.
  - type: input
    id: version
    attributes:
      label: TS++ version
      description: Paste the output of `tspp --version` or the commit hash.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the exact `tspp` command and relevant configuration.
      render: shell
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal reproduction
      render: typescript
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream TypeScript comparison
      description: Explain whether the same input behaves differently under upstream `tsc`.
