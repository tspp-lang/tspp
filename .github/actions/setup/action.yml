name: Set up the workspace
description: Installs the workspace dependencies and prepares the pinned TS++ bootstrap compiler. Check out the repository first.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.4.2
        run_install: false
    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: 22.22.0
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: bootstrap-pin
      run: echo "commit=$(node -p 'require("./scripts/bootstrap-pin.json").commit')" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: .bootstrap/${{ steps.bootstrap-pin.outputs.commit }}
        key: tspp-bootstrap-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bootstrap-pin.outputs.commit }}
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Git Bash's GNU tar treats drive letters in archive paths as remote hosts.
        $env:Path = (Join-Path $env:SystemRoot 'System32') + ';' + $env:Path
        pnpm bootstrap:install
    - if: runner.os != 'Windows'
      run: pnpm bootstrap:install
      shell: bash
