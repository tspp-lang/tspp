pre-commit:
  parallel: false
  commands:
    normalize-staged:
      run: node scripts/format-staged.mjs
    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm lint
    knip:
      glob: 'packages/compiler/**'
      run: pnpm knip
    skills:
      glob: '{packages/plugins/*/skills/**,scripts/skills-entry.md,scripts/build-skills.mjs,scripts/plugin-entries.mjs,package.json}'
      run: node scripts/build-skills.mjs --stage

post-checkout:
  commands:
    generate-diagnostics:
      run: pnpm --filter ts-plus-plus exec hereby generate-diagnostics || true
